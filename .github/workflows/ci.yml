name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Test
        run: pytest
      - name: CLI scenarios
        shell: bash
        run: |
          while read -r scenario; do
            python -m text2business.cli --scenario "$scenario" >/dev/null
          done < <(python -m text2business.cli --list-scenarios)
      - name: Streamlit import
        run: python -c "import text2business.app"
